[package]
name = "app"
version = "0.5.1"
description = "ccanvas Pi — personal Pi-first fork of ccanvas"
authors = ["you"]
license = ""
repository = "https://github.com/chunkanglu/ccanvas"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.9"
notify = "6"
base64 = "0.22"
